# One-off, read-only, free: what the free data sources cover for the coin scanner plan (reports/18).
name: Scanner check
on:
  push:
    branches: [claude/scanner-plan]
    paths: [tools/scanner_check.py, .github/workflows/scanner-check.yml]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests
      - run: python tools/scanner_check.py out
      - name: Publish the result to a side branch
        if: always()
        run: |
          mkdir -p out && cd out && git init -q -b scanner-check-results
          git config user.name "macro-hub bot" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "Scanner check result" && \
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" scanner-check-results
