# Coin scanner (reports/18): daily at 00:50 UTC (08:50 Hong Kong), after the day's close. Free data only.
# By hand: Actions tab -> Coin scanner -> Run workflow. Writes only scanner/ on the data branch. Context only.
name: Coin scanner
on:
  schedule:
    - cron: "50 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: coin-scanner
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 75        # the first run loads a year of prices for about 110 coins (CoinGecko's free pace)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --quiet -r requirements.txt
      - run: tools/data_branch.sh open
      - name: Scan
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m hub.scanner.scan --data data
      - run: tools/data_branch.sh save "Coin scanner"
      - name: Tell the phone if the scanner failed
        if: failure() || cancelled()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m hub.notify --failed "the coin scanner" --runtime runtime
