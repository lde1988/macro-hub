# Sends one test push to the phone. Run by hand (Actions tab -> Test push -> Run workflow)
# or, on the build branch only, by changing ops/test-push-request.
name: Test push
on:
  workflow_dispatch:
  push:
    branches: [claude/build]
    paths: [ops/test-push-request]
jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --quiet -r requirements.txt
      - name: Send test push
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m hub.notify --test
