# One-off trial on the claude/scanner-plan branch: runs the scanner and the backtest on a COPY of the data branch
# (nothing is saved to it) and publishes the result to the scanner-check-results branch. Free.
name: Scanner trial
on:
  push:
    branches: [claude/scanner-plan]
    paths: [hub/scanner/**, config/scanner.yaml, tools/scanner_backtest.py, .github/workflows/scanner-trial.yml]
permissions:
  contents: write
jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --quiet -r requirements.txt
      - run: git fetch --quiet --depth=1 origin data && git worktree add --quiet --detach data FETCH_HEAD
      - run: python -m hub.scanner.scan --data data --no-push
      - run: python tools/scanner_backtest.py --data data --out out
      - name: Publish to a side branch (the data branch is not touched)
        if: always()
        run: |
          mkdir -p out && cp -r data/scanner out/ 2>/dev/null || true
          cd out && git init -q -b scanner-check-results
          git config user.name "macro-hub bot" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "Scanner trial result" && \
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" scanner-check-results
