# The hub: fetch data, work out the dials and the reading, publish the dashboard and
# feed to GitHub Pages, log, and send pushes. One run does all of it.
# Runs every 15 minutes. To run it by hand: Actions tab -> Hub run -> Run workflow.
# To pause it: Actions tab -> Hub run -> "..." menu -> Disable workflow. (See README.)
name: Hub run
on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 minutes, off the hour (GitHub's busiest minute)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [ops/run-request]
permissions:
  contents: write    # to save history to the data branch
  pages: write       # to publish the dashboard
  actions: write     # to keep the scheduled workflows switched on (see "Keep the schedules alive")
  id-token: write    # required by GitHub Pages
concurrency:
  group: hub-run     # never two runs at once
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --quiet -r requirements.txt
      - name: Restore fast-changing bookkeeping
        uses: actions/cache/restore@v4
        with:
          path: runtime
          key: runtime-${{ github.run_id }}
          restore-keys: runtime-
      - run: tools/data_branch.sh open
      - name: Fetch, evaluate, write outputs, push alerts
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m hub.run --data data --site site --runtime runtime
      - run: tools/data_branch.sh save "Hub run"
      - name: Keep the schedules alive
        # Brings back any of the three scheduled workflows that has been switched off (by GitHub after
        # 60 quiet days, or by mistake). The data this run saves is itself the activity that keeps the clock reset.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only a workflow that is NOT active is switched back on. Re-enabling an active one
          # re-registers its timer, and GitHub can then take hours to fire it again.
          for w in hub.yml watchdog.yml oi-daily.yml; do
            state=$(gh api "repos/${{ github.repository }}/actions/workflows/$w" --jq .state 2>/dev/null || echo unknown)
            if [ "$state" != "active" ] && [ "$state" != "unknown" ]; then
              gh workflow enable "$w" --repo "${{ github.repository }}" && echo "switched $w back on (was $state)"
            fi
          done
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Tell the phone if the run failed or timed out (at most once an hour)
        if: failure() || cancelled()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m hub.notify --failed "the hub run" --runtime runtime
      - name: Save fast-changing bookkeeping
        if: always()
        uses: actions/cache/save@v4
        with:
          path: runtime
          key: runtime-${{ github.run_id }}
  publish:
    needs: run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Tell the phone if publishing failed (at most twice an hour)
        if: failure() || cancelled()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          m=$((10#$(date -u +%M)))
          if [ "$m" -ge 15 ] && [ "$m" -lt 45 ]; then
            curl -sS -o /dev/null -H "Title: macro-hub: publishing failed" -H "Priority: 4" \
              -d "The dashboard could not be published this run, so the page may be out of date. Data and alerts are unaffected." \
              "https://ntfy.sh/${NTFY_TOPIC}" || true
          fi
