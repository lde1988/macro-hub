# The hub: fetch data, work out the dials and the reading, publish the dashboard and
# feed to GitHub Pages, log, and send pushes. One run does all of it.
# Run by hand: Actions tab -> Hub run -> Run workflow. (The 15-minute schedule is added at go-live.)
name: Hub run
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [ops/run-request]
permissions:
  contents: write    # to save history to the data branch
  pages: write       # to publish the dashboard
  id-token: write    # required by GitHub Pages
concurrency:
  group: hub-run     # never two runs at once
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --quiet -r requirements.txt
      - name: Restore fast-changing bookkeeping
        uses: actions/cache/restore@v4
        with:
          path: runtime
          key: runtime-${{ github.run_id }}
          restore-keys: runtime-
      - run: tools/data_branch.sh open
      - name: Fetch, evaluate, write outputs, push alerts
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m hub.run --data data --site site --runtime runtime
      - run: tools/data_branch.sh save "Hub run"
      - name: Save fast-changing bookkeeping
        if: always()
        uses: actions/cache/save@v4
        with:
          path: runtime
          key: runtime-${{ github.run_id }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
