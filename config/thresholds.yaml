# Every threshold the hub uses, in one place. Levels reflect November 2026.
# Changing a number here changes the dial; nothing else needs editing.
# Bands were approved by the owner on 25 November 2026 (reports/03-dial-bands.md).

general:
  confirm_runs: 2            # a dial changes colour only after this many runs in a row beyond a band edge
  price_buffer: 0.02         # Bitcoin price levels: price must be 2% beyond a level to change the colour
  fresh_red_trading_days: 5  # a dial counts as "newly red" for this many trading days
  stale_minutes: 60          # dashboard "updated" time turns amber when older than this
  source_down_runs: 4        # a source failing this many runs in a row raises a "source down" push
  cross_check_gap: 0.05      # flag when two sources for the same metric differ by more than 5%

levels:                      # fixed levels; Coutts' posts may update these automatically (Phase 2), within 15%
  btc_value_zone: 58600      # first-half 2026 low: at or below this the price dial is green
  btc_break: 70000           # a weekly close below this is a BREAK
  btc_reclaim: 73000         # the break ends only on a weekly close above this
  realised_price: 53000      # fallback, used only if every live source fails
  lth_cost: 48000            # fallback long-term holder cost
  sth_cost: 75000            # fallback short-term holder cost
  levels_as_of: "2026-11-15" # date of the fallback levels above, shown when they are in use
  feb_2026_net_loss_peak: 30.0e9  # 30-day net realised loss at its February 2026 peak (20 Feb), a marker only

btc_price:
  froth_multiple: 2.4        # red above this many times realised price
  confirmed_buy_multiple: 1.3  # BUY (CONFIRMED) needs price at or below this many times realised price
  # for history replays only: the value zone as a multiple of realised price (58,600 / 53,100 today).
  # null means "use levels.btc_value_zone".
  value_zone_multiple: null

weekly_move:
  lookback_weeks: 52         # weekly moves are measured against the past year
  green_at_or_below: -2.0    # a fall of 2 standard deviations or more: washout-sized
  red_at_or_above: 2.0       # a rise of 2 standard deviations or more: blow-off-sized

lth_sopr:
  green_at_or_below: 0.7     # past cycle lows: 0.49 (2015), 0.47 (2019), 0.47 (2022)
  red_above: 3.0             # long-term holders selling at large profits (2017, 2021, mid-2024)

net_loss:
  green_percentile: 95       # net realised losses / realised cap at or above this percentile of all history
  min_history_days: 400      # days of history needed before a percentile means anything

btc_ndx:
  average_days: 100          # Bitcoin / Nasdaq-100 compared with its own 100-trading-day average
  green_above: 0.02          # 2% or more above the average
  red_below: -0.02           # 2% or more below

alt_value:
  change_days: 30
  green_at_or_above: 0.05    # altcoin value / Bitcoin value up 5% or more in 30 days
  red_at_or_below: -0.05

alt_watch:
  coins: [SUIUSD, SOLUSD, NEARUSD, LINKUSD, TAOUSD]
  change_days: 30
  green_at_or_above: 0.10    # watchlist up 10% or more against Bitcoin in 30 days
  red_at_or_below: -0.10

margin_debt:
  fire_above: 1.0            # 3-month annualised growth above +100% ...
  within_months: 12          # ... at some point in the past 12 months ...
  now_below: 0.0             # ... and now below 0: the signal has fired (dial red)
  regime_latch_months: 12    # for the FRAGILE regime the signal stays "fired" this long once triggered

sofr_iorb:
  median_days: 5
  green_at_or_below: 0.0     # basis points
  red_above: 5.0

yields:
  change_days: 20            # trading days
  green_at_or_below: -15.0   # basis points
  red_at_or_above: 25.0

hike_pricing:                # 2-year yield minus effective Fed funds, change over 20 trading days
  change_days: 20
  green_at_or_below: -20.0   # basis points: hikes being priced out
  red_at_or_above: 10.0      # hikes being priced in (not "any rise": 1bp of noise must not flip it)

cpi:
  green_at_or_below: 0.2     # percent month-on-month, rounded to one decimal as published
  red_at_or_above: 0.4

breakeven:
  green_at_or_below: 2.4     # percent
  red_above: 2.7

liquidity:
  green_at_or_above: 5.0     # percent year-on-year
  red_below: 0.0

dollar:
  level: 102.5               # the reversal level
  confirm_level: 100.0       # below this the reversal is "confirmed"
  margin: 0.3                # a level counts as crossed only 0.3 beyond it ...
  fixings: 2                 # ... on this many ECB fixings in a row
  rising_days: 20            # "rising" = higher than this many fixings ago

sp500:
  average_months: 10
  amber_fall: 0.10           # 10% below the 1-year high
  red_fall: 0.20             # 20% below

funding:
  average_days: 30
  intervals_per_day: 3       # funding is paid every 8 hours on the three exchanges used
  red_at_or_above: 30.0      # percent a year; green when negative

alt_oi:
  green_below: 50            # percentile
  red_at_or_above: 90
  min_history_days: 365

stablecoins:
  change_days: 30
  red_below: -3.0            # percent; green when positive

hy_spread:   {change_days: 63, green_below: 75.0,  red_above: 150.0}   # basis points over 3 months
ccc_bb:      {change_days: 63, green_below: 150.0, red_above: 300.0}   # CCC minus BB gap
bbb_spread:  {change_days: 63, green_below: 25.0,  red_above: 50.0}

nfci:    {green_at_or_below: -0.25, red_above: 0.0}   # zero = average conditions
stlfsi:  {green_at_or_below: 0.0,   red_above: 1.0}   # zero = normal stress

ai_basket:
  members: [CRWV, ORCL, NBIS, APLD, IREN]
  change_days: 63
  green_above: -10.0         # basket's 3-month return minus the S&P 500's, in percentage points
  red_below: -25.0

bizd:  {high_days: 63,  green_below: 6.0,  red_at_or_above: 12.0}   # percent fall from the 3-month high
kre:   {high_days: 252, green_below: 15.0, red_at_or_above: 25.0}   # percent fall from the 1-year high

discount_window:             # billions of dollars
  amber_level: 10.0
  red_level: 25.0
  amber_rise_4w: 5.0
  red_rise_4w: 10.0

srf:   {median_days: 5, green_at_or_below: 1.0, red_above: 10.0}    # billions of dollars

front_end:   {change_days: 20, green_at_or_below: -25.0, red_at_or_above: 25.0}  # 2-year yield, basis points
fed_bills:   {weeks: 4, green_at_or_above: 20.0, red_at_or_below: -20.0}         # billions of dollars
fed_reserves: {weeks: 4, green_at_or_above: 75.0, red_at_or_below: -75.0}
weekly_reclaim: {green_weeks: 12}  # a reclaim counts as a fresh turn for 12 weeks
buybacks:
  recent_days: 28
  prior_days: 84
  green_at_or_above: 1.5     # latest 4 weeks at 1.5 times the prior average or more: a step up
  red_at_or_below: 0.67

# Families: each counts once. Only a fresh red in money_market, credit or banks blocks a buy.
families:
  rates_dollar:    [y2_chg, y10_chg, hike_pricing, cpi_mom, breakeven, liquidity, dollar]
  money_market:    [sofr_iorb, discount_window, srf]
  credit:          [hy_spread, ccc_bb, bbb_spread, nfci, stlfsi]
  ai_private:      [ai_basket, bizd]
  banks:           [kre]
  crypto_leverage: [funding, alt_oi, stable_30d]
  equities:        [sp500, margin_debt]
buy_blocking_families: [money_market, credit, banks]

# Turn families. The turn is confirmed when the dollar reversal dial is green,
# or when two of these three families are green together.
turn_families:
  rates:            [front_end, hikes_out]
  fed_treasury:     [fed_bills, buybacks]   # bank reserves alone never confirm a turn
  crypto_liquidity: [stable_turn]
