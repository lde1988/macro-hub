# Every threshold the hub uses, in one place. Levels reflect November 2026.
# Changing a number here changes the dial; nothing else needs editing.
# Bands were approved by the owner on 25 November 2026 (reports/03-dial-bands.md).

general:
  confirm_runs: 2            # a dial changes colour only after this many runs in a row beyond a band edge
  price_buffer: 0.02         # Bitcoin price levels: price must be 2% beyond a level to change the colour
  fresh_red_trading_days: 5  # a dial counts as "newly red" for this many trading days
  stale_minutes: 60          # dashboard "updated" time turns amber when older than this
  source_down_runs: 4        # a source failing this many runs in a row raises a "source down" push
  enforce_max_age: true      # stale data cannot change a dial's colour (history replays switch this off: their data is dated by estimate)
  cross_check_gap: 0.05      # flag when two sources for the same metric differ by more than 5%

max_age_days:                # a dial is greyed out as "stale" when its newest data is older than this
  default: 5                 # daily series: allows a long weekend plus a holiday
  btc_price: 1               # live price; yesterday's close is tolerated for a short outage, never older
  alt_watch: 2               # live prices
  stable_30d: 3              # daily
  stable_turn: 3             # daily
  btc_weekly: 9              # weekly close
  weekly_move: 9             # weekly close
  weekly_reclaim: 9          # weekly close
  margin_debt: 75            # monthly, published about 3 to 4 weeks after month end
  cpi_mom: 80                # monthly, dated the 1st of its month
  liquidity: 21              # weekly central-bank balance sheets (FRED's ECB series can run a week behind)
  nfci: 16                   # weekly
  stlfsi: 16                 # weekly
  discount_window: 12        # weekly
  fed_bills: 12              # weekly
  fed_reserves: 12           # weekly

alerts:
  digest_hour_hkt: 8         # one quiet daily digest at 08:00 Hong Kong time; it doubles as a heartbeat
  digest_priority: 2         # low: no sound
  reading_priority: 5        # buy / hold change
  regime_priority: 5         # regime change
  trend_exit_priority: 5     # trend exit turning RISK-OFF or RISK-ON
  dial_red_priority: 4       # a dial turning red
  dial_change_priority: 3    # a dial turning amber from green
  improvement_priority: 2    # a dial turning green, or amber from red
  source_down_priority: 3    # a source failing 4 runs in a row
  stale_priority: 3          # a dial's data becoming too old to trust
  max_outbox: 20             # unsent pushes kept for retry
  silence_hours: 3           # after this many hours without a run, the next run pushes "running again"
  silence_priority: 4        # priority of that push

levels:                      # fixed levels; Coutts' posts may update these automatically (Phase 2), within 15%
  btc_value_zone: 58600      # first-half 2026 low: at or below this the price dial is green
  btc_break: 70000           # a weekly close below this is a BREAK
  btc_reclaim: 73000         # the break ends only on a weekly close above this
  realised_price: 53000      # fallback, used only if every live source fails
  lth_cost: 48000            # fallback long-term holder cost
  sth_cost: 75000            # fallback short-term holder cost
  levels_as_of: "2026-11-15" # date of the fallback levels above, shown when they are in use
  feb_2026_net_loss_peak: 30.0e9  # 30-day net realised loss at its February 2026 peak (20 Feb), a marker only

dynamic_levels:              # the fixed levels above, re-expressed so they move with the market
  value_zone_x_realised: 1.10  # value zone = 1.10 times realised price (58,600 / 53,100 in Nov 2026)
  reclaim_x_sth: 1.0         # reclaim line = short-term holder realised price (stand-in for 73,000)
  break_x_sth: 0.96          # break line = 0.96 times it (stand-in for 70,000; 70,000 / 73,000 = 0.96)
  use_for_colours: false     # false = live: fixed levels colour the dials, dynamic ones are shown beside them.
                             # true = history replays only, where fixed dollar levels mean nothing.

btc_price:
  froth_multiple: 2.4        # red above this many times realised price
  confirmed_buy_multiple: 1.3  # BUY (CONFIRMED) needs price at or below this many times realised price

weekly_move:
  lookback_weeks: 52         # weekly moves are measured against the past year
  green_at_or_below: -2.0    # a fall of 2 standard deviations or more: washout-sized
  red_at_or_above: 2.0       # a rise of 2 standard deviations or more: blow-off-sized

lth_sopr:
  green_at_or_below: 0.7     # past cycle lows: 0.49 (2015), 0.47 (2019), 0.47 (2022)
  red_above: 3.0             # long-term holders selling at large profits (2017, 2021, mid-2024)

net_loss:
  green_percentile: 95       # net realised losses / realised cap at or above this percentile of all history
  min_history_days: 400      # days of history needed before a percentile means anything

btc_ndx:
  average_days: 100          # Bitcoin / Nasdaq-100 compared with its own 100-trading-day average
  green_above: 0.02          # 2% or more above the average
  red_below: -0.02           # 2% or more below

btc_ma:                      # context only: shown in "Is it cheap?" but not counted in the group or the reading
  ma_days: 200               # 200-day moving average of the daily close
  ma_weeks: 200              # 200-week moving average of the weekly close, shown as a marker
  green_at_or_below: 0.8     # price at or below 0.8 times its 200-day average
  red_at_or_above: 2.4       # price at or above 2.4 times its 200-day average

alt_value:
  change_days: 30  # days over which the change is measured
  green_at_or_above: 0.05    # altcoin value / Bitcoin value up 5% or more in 30 days
  red_at_or_below: -0.05  # down 5% or more: red

alt_watch:
  coins: [SUIUSD, SOLUSD, NEARUSD, LINKUSD, TAOUSD]  # the five watchlist coins, priced in Bitcoin
  change_days: 30  # days over which the change is measured
  green_at_or_above: 0.10    # watchlist up 10% or more against Bitcoin in 30 days
  red_at_or_below: -0.10  # down 10% or more: red

margin_debt:
  fire_above: 1.0            # 3-month annualised growth above +100% ...
  within_months: 12          # ... at some point in the past 12 months ...
  now_below: 0.0             # ... and now below 0: the signal has fired (dial red)
  regime_latch_months: 12    # for the FRAGILE regime the signal stays "fired" this long once triggered

sofr_iorb:
  median_days: 5  # days in the median
  green_at_or_below: 0.0     # basis points
  red_above: 5.0  # basis points; red above this

yields:
  change_days: 20            # trading days
  green_at_or_below: -15.0   # basis points
  red_at_or_above: 25.0  # basis points; red at a rise this large

hike_pricing:                # 2-year yield minus effective Fed funds, change over 20 trading days
  change_days: 20  # trading days
  green_at_or_below: -20.0   # basis points: hikes being priced out
  red_at_or_above: 10.0      # hikes being priced in (not "any rise": 1bp of noise must not flip it)

cpi:
  green_at_or_below: 0.2     # percent month-on-month, rounded to one decimal as published
  red_at_or_above: 0.4  # percent month-on-month; red at this or more

breakeven:
  green_at_or_below: 2.4     # percent
  red_above: 2.7  # percent; red above this

liquidity:
  green_at_or_above: 5.0     # percent year-on-year
  red_below: 0.0  # percent year-on-year; red when shrinking

dollar:
  level: 102.5               # the reversal level
  confirm_level: 100.0       # below this the reversal is "confirmed"
  margin: 0.3                # a level counts as crossed only 0.3 beyond it ...
  fixings: 2                 # ... on this many ECB fixings in a row
  rising_days: 20            # "rising" = higher than this many fixings ago

sp500:
  average_months: 10  # months in the average of month-end closes
  amber_fall: 0.10           # 10% below the 1-year high
  red_fall: 0.20             # 20% below

funding:
  average_days: 30  # days in the average
  intervals_per_day: 3       # funding is paid every 8 hours on the three exchanges used
  red_at_or_above: 30.0      # percent a year; green when negative

alt_oi:
  matched_to_coutts: true    # true since 25 Nov 2026: the stored series reads 1.65x at the 99th percentile on 27 Sep 2026,
                             # against Coutts' 1.66x at the 98th (reports/09). Set false to label the dial
                             # "proxy, not matched to Coutts" and keep it out of the froth warning and the altcoin buy line.
  green_below: 50            # percentile
  red_at_or_above: 90  # percentile; red at or above
  min_history_days: 365  # days of history needed before a percentile means anything

stablecoins:
  change_days: 30  # days over which the change is measured
  red_below: -3.0            # percent; green when positive

hy_spread:   {change_days: 63, green_below: 75.0,  red_above: 150.0}   # basis points over 3 months
ccc_bb:      {change_days: 63, green_below: 150.0, red_above: 300.0}   # CCC minus BB gap
bbb_spread:  {change_days: 63, green_below: 25.0,  red_above: 50.0}  # BBB moves about a third as much as high yield

nfci:    {green_at_or_below: -0.25, red_above: 0.0}   # zero = average conditions
stlfsi:  {green_at_or_below: 0.0,   red_above: 1.0}   # zero = normal stress

ai_basket:
  members: [CRWV, ORCL, NBIS, APLD, IREN]  # equal-weight basket of debt-funded AI names
  change_days: 63  # trading days (3 months)
  green_above: -10.0         # basket's 3-month return minus the S&P 500's, in percentage points
  red_below: -25.0  # red when trailing by more than 25 points

bizd:  {high_days: 63,  green_below: 6.0,  red_at_or_above: 12.0}   # percent fall from the 3-month high
kre:   {high_days: 252, green_below: 15.0, red_at_or_above: 25.0}   # percent fall from the 1-year high

discount_window:             # billions of dollars
  amber_level: 10.0  # amber above this level
  red_level: 25.0  # red above this level
  amber_rise_4w: 5.0  # amber on a rise this large in 4 weeks
  red_rise_4w: 10.0  # red on a rise this large in 4 weeks

srf:   {median_days: 5, green_at_or_below: 1.0, red_above: 10.0}    # billions of dollars

front_end:   {change_days: 20, green_at_or_below: -25.0, red_at_or_above: 25.0}  # 2-year yield, basis points
fed_bills:   {weeks: 4, green_at_or_above: 20.0, red_at_or_below: -20.0}         # billions of dollars
fed_reserves: {weeks: 4, green_at_or_above: 150.0, red_at_or_below: -150.0}  # billions; widened from 75 (fired 12 times in 2 years)
hikes_out:   {change_days: 20, green_at_or_below: -30.0, red_at_or_above: 10.0}  # dial 25; widened from -20bp (fired 9 times in 2 years)
weekly_reclaim: {green_weeks: 12}  # a reclaim counts as a fresh turn for 12 weeks
buybacks:
  recent_days: 28  # the latest 4 weeks
  prior_days: 84  # the 12 weeks before that
  green_at_or_above: 1.5     # latest 4 weeks at 1.5 times the prior average or more: a step up (owner kept 1.5 so August 2026 fires)
  red_at_or_below: 0.67  # a step down

# Families: each counts once. Only a fresh red in money_market, credit or banks blocks a buy.
families:
  rates_dollar:    [y2_chg, y10_chg, hike_pricing, cpi_mom, breakeven, liquidity, dollar]  # interest rates, inflation, liquidity and the dollar
  money_market:    [sofr_iorb, discount_window, srf]  # overnight funding and Fed lending facilities
  credit:          [hy_spread, ccc_bb, bbb_spread, nfci, stlfsi]  # bond spreads and the two Fed stress indexes
  ai_private:      [ai_basket, bizd]  # AI-debt canaries and the private-credit fund
  banks:           [kre]  # regional banks
  crypto_leverage: [funding, alt_oi, stable_30d]  # funding rate, altcoin open interest, stablecoin supply
  equities:        [sp500, margin_debt]  # S&P 500 and margin debt
buy_blocking_families: [money_market, credit, banks]  # only these families can block a buy

froth_warning:
  record: "right on 3 of 8 past occasions"  # shown beside the warning; from the history replay (reports/06b), update if re-run
  push_priority: 4           # a froth warning pushes at priority 4, not 5: its record is weak

turn:
  fresh_weeks: 13            # a group D dial counts toward "turn confirmed" and the TURN regime only this long after turning green

# Turn families. The turn is confirmed when the dollar reversal dial is green,
# or when two of these three families are green together.
turn_families:
  rates:            [front_end, hikes_out]  # dials 20 and 25
  fed_treasury:     [fed_bills, buybacks]   # bank reserves alone never confirm a turn
  crypto_liquidity: [stable_turn]  # dial 22

# Coin valuations tab (context only: never part of the reading, the backdrop or any push)
valuations:
  coins:                     # card order; each: name, history series (Coin Metrics), live-price series (Coinbase)
    - {sym: BTC,  name: Bitcoin,     history: CMP_BTC,  live: BTCUSD}  # card 1
    - {sym: ETH,  name: Ether,       history: CMP_ETH,  live: ETHUSD}  # card 2
    - {sym: SOL,  name: Solana,      history: CMP_SOL,  live: SOLUSD}  # card 3
    - {sym: SUI,  name: Sui,         history: CMP_SUI,  live: SUIUSD}  # card 4
    - {sym: LINK, name: Chainlink,   history: CMP_LINK, live: LINKUSD}  # card 5
    - {sym: NEAR, name: NEAR,        history: CMP_NEAR, live: NEARUSD}  # card 6
    - {sym: ZEC,  name: Zcash,       history: CMP_ZEC,  live: ZECUSD}  # card 7
    - {sym: HYPE, name: Hyperliquid, history: CMP_HYPE, live: HYPEUSD}  # card 8
    - {sym: WAL,  name: Walrus,      history: CMP_WAL,  live: WALUSD}  # card 9
    - {sym: DEEP, name: DeepBook,    history: CMP_DEEP, live: DEEPUSD}  # card 10
  min_years_dial: 1.0        # under this: no dial, only "too little history"
  min_years_confident: 3.0   # under this: dial greyed, "short history, low confidence"
  min_r_squared: 0.3         # under this: dial greyed, "the line does not fit this coin's history; reading not meaningful"
  live_max_gap: 0.25         # ignore a live price more than 25% away from the last daily close (bad print)
  stretch_ma_days: 200       # "stretch from trend": log of price over its 200-day moving average ...
  stretch_min_days: 365      # ... scored against at least 365 days of its own history of that measure
