# Measures a record may be tagged with. The reading model must pick one of these keys (or "other").
# `hub` says how the hub reads the same measure, for the calibration table; measures without it are not tracked
# by the hub and can become dial proposals. units: usd, pct, bp_as_pct (stored in %, quoted in bp), x, index, yoy_pct.
metrics:
  realised_price:    {label: "Bitcoin realised price", hub: {series: BV_REALIZED_PRICE}, units: usd}
  lth_cost:          {label: "Long-term holder cost basis", hub: {series: BV_LTH_REALIZED_PRICE}, units: usd}
  sth_cost:          {label: "Short-term holder cost basis", hub: {series: BV_STH_REALIZED_PRICE}, units: usd}
  regime_filter:     {label: "Coutts' regime-filter level", hub: {level: btc_break}, units: usd}
  btc_price:         {label: "Bitcoin price", hub: {series: BTCUSD}, units: usd}
  mvrv:              {label: "Bitcoin price / realised price (MVRV)", hub: {ratio: [BTCUSD, BV_REALIZED_PRICE]}, units: x}
  lth_sopr:          {label: "Long-term holder SOPR", hub: {series: BV_LTH_SOPR_1M}, units: index}
  btc_log_regression: {label: "Bitcoin log-regression reading (SD)", hub: {valuation: BTC}, units: index}
  alt_btc_oi:        {label: "Altcoin / Bitcoin open interest", hub: {ratio: [OI_ALT, OI_BTC]}, units: x}
  funding_rate:      {label: "Bitcoin funding rate", hub: {tracked: true}}
  stablecoin_supply: {label: "Stablecoin supply", hub: {series: STABLE_USD}, units: usd}
  global_liquidity:  {label: "Global liquidity", hub: {tracked: true}}
  fed_balance_sheet: {label: "Fed balance sheet", hub: {series: WALCL, scale: 1.0e6}, units: usd}
  m2:                {label: "US M2 money supply growth", hub: {yoy: M2SL}, units: yoy_pct}
  hy_spread:         {label: "High-yield credit spread", hub: {series: BAMLH0A0HYM2}, units: bp_as_pct}
  ccc_spread:        {label: "CCC credit spread", hub: {series: BAMLH0A3HYC}, units: bp_as_pct}
  bbb_spread:        {label: "BBB credit spread", hub: {series: BAMLC0A4CBBB}, units: bp_as_pct}
  dxy:               {label: "Dollar index", hub: {series: DXY_PUB}, units: index}
  us10y:             {label: "US 10-year yield", hub: {series: DGS10}, units: pct}
  us2y:              {label: "US 2-year yield", hub: {series: DGS2}, units: pct}
  fed_funds:         {label: "Fed funds rate", hub: {series: DFF}, units: pct}
  cpi:               {label: "US inflation (CPI, year on year)", hub: {yoy: CPIAUCSL}, units: yoy_pct}
  sp500:             {label: "S&P 500", hub: {series: SP500}, units: index}
  nasdaq100:         {label: "Nasdaq-100", hub: {series: NASDAQ100}, units: index}
  margin_debt:       {label: "Margin debt", hub: {tracked: true}}
  private_credit:    {label: "Private credit / BDCs", hub: {tracked: true}}
  regional_banks:    {label: "Regional banks", hub: {tracked: true}}
  ai_capex:          {label: "AI capital spending"}
  gpu_prices:        {label: "GPU rental prices"}
  earnings:          {label: "Corporate earnings"}
  equity_valuation:  {label: "Stock valuation multiples"}
  oil:               {label: "Oil price"}
  gold:              {label: "Gold price"}
  defi_revenue:      {label: "DeFi revenue"}
  data_centers:      {label: "Data-centre capacity"}
  tariffs:           {label: "Tariffs and trade"}
  fiscal_deficit:    {label: "US fiscal deficit"}
  other:             {label: "Other"}

# The one exception to "context only" (owner's rule): Jamie Coutts stating a new value for a level the hub
# tracks updates it, within 15%; beyond that, or if the post is ambiguous, the owner is asked.
# Each metric key maps to the level it may update in config/thresholds.yaml `levels` (overrides kept on the
# data branch in sweep/levels.json; nothing else in the config can ever be changed by the sweep).
level_updates:
  person: coutts
  keys:
    realised_price: realised_price          # fallback value (the live figure comes from Bitview)
    lth_cost: lth_cost                       # fallback value
    sth_cost: sth_cost                       # fallback value
    regime_filter:                           # needs the post to say which line it is
      break: btc_break
      reclaim: btc_reclaim

