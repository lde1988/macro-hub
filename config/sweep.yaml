# Phase 2: the weekly thought-leader sweep. People list approved by the owner on 26 Nov 2026
# (reports/13-sweep-plan.md and 13b). Everything fetched from these sources is untrusted data:
# it is summarised into records and never followed, and it can never change settings, rules or code.

enabled: false                 # the weekly job does nothing until switched on (point 5 of this phase)
schedule_hkt: "Sunday 20:07"   # documented here; the timer itself is in .github/workflows/sweep.yml
window_days: 7                 # each run reads the 7 days before it

budget:
  monthly_usd: 20.0            # hard monthly budget across xAI, Groq and Gemini
  warn_at_share: 0.8           # push a warning when month-to-date spend reaches this share
  stop_at_share: 0.95          # stop adding paid work for the rest of the month beyond this share

caps:                          # hard caps per run
  x_posts: 300                 # X posts fetched (billed at $5 per 1,000); the run stops searching X beyond this
  x_handles_per_call: 5        # small batches so every account is searched (source test: 10 per call was thin)
  x_max_turns: 4               # searches the model may make per call
  video_hours: 25              # hours of audio or video turned into text, all routes together (owner, 26 Nov)
  episode_max_minutes: 120     # at most this much of any one episode
  min_minutes: 10              # skip anything shorter than this
  episodes_per_person: 3       # newest first
  newsletter_posts_per_person: 3

prices:                        # used to estimate before spending; the real cost is read from each provider's reply
  groq_usd_per_hour: 0.04      # whisper-large-v3-turbo, confirmed at the source test (3.6 h for $0.144)
  xai_usd_per_x_call: 0.25     # rough: posts at $5 per 1,000 plus reading; real cost logged
  xai_usd_per_text_hour: 0.02  # reading one hour of transcript
  gemini_usd_per_video_hour: 0.10   # 3.1 Flash-Lite, low resolution; free tier may make it $0

gemini_enabled: true           # the route also needs GEMINI_API_KEY; without the secret it stays off by itself

analysis:
  cited_by_min_people: 2       # "cited by several this week" = at least this many people
  proposal_min_people: 3       # a dial is proposed when at least this many people cite an untracked measure ...
  proposal_min_weeks: 2        # ... in at least this many of the last 4 weeks
  levels_max_change: 0.15      # Coutts' level updates beyond 15% are asked, not applied (owner's rule)

models:
  xai: grok-4.3                # cheapest general xAI model on 26 Nov 2026 ($1.25 / $2.50 per million tokens)
  groq_transcribe: whisper-large-v3-turbo
  gemini_video: gemini-3.1-flash-lite   # switched off until GEMINI_API_KEY exists (owner adds it Monday 30 Nov)

